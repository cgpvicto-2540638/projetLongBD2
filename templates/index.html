{% include 'header.html' %}
    <h1>Enter une commande</h1>
    <form action="/ajoutCommande" method="post">
        <div>
            <h2>Enter le client</h2>
            <div>
                <label for="nomClient">Nom du client: </label><br>
                <input type="text" id="nomClient" name="nomClient" required><br>
            </div>
            <div>
                <label for="telephone">Téléphone : </label><br>
                <input type="tel" id="telephone" name="telephone" required><br>
            </div>
        </div>
        <div>
            <h2>Enter les détails de la commande</h2>
            <div>
                <label for="heure">Heure (format hh:mm): </label><br>
                <input type="text" id="heure" name="heure" required><br>
            </div>
            <div>
                <label for="adresse">Adresse: </label><br>
                <input type="text" id="adresse" name="adresse" required><br>
            </div>
            <div>
                <button type="submit" id="bouton" name="bouton">Envoyer</button>
            </div>
        </div>
    </form>
</body>
</html>
