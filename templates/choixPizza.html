<!DOCTYPE html>
<html>
<head>
    <title>Page de données</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Choisiser votre Pizza</h1>
    <form action="/ajoutPizza" method="post">
        <div>
            <label for="croutes">Choisiser votre croutes: </label><br>
            <select name="croutes" id="croutes">
                <option value="">enter une croutes</option>
                {% for row in data['croutes']%}
                    <option value="{{ row }}">{{ row }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label for="sauces">Choisiser votre sauces: </label><br>
            <select name="sauces" id="sauces">
                <option value="">enter une sauces</option>
                {% for row in data['sauces'] %}
                    <option value="{{ row }}">{{ row }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <h2 for="garnitures">Choisiser votre garnitures: </label><br>
            {% for row in data['garnitures'] %}
            <div class="divRadio">
                <input type="radio" id="{{ row }}" name="{{row }}"></input>
                <label class="radio" for="{{ row }}">{{ row }}</label>
            </div>

            {% endfor %}
        </div>
        <div>
            <button type="submit" id="bouton" name="bouton">Envoyer</button>
        </div>

    </form>
</body>
</html>
